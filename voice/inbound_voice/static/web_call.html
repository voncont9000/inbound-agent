<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Browser practice call</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f4f6f8;
        color: #16212b;
      }
      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        margin: 0;
      }
      main {
        width: min(28rem, calc(100% - 2rem));
        padding: 2rem;
        border: 1px solid #dce2e8;
        border-radius: 1rem;
        background: white;
        box-shadow: 0 1rem 3rem #16212b12;
      }
      h1 { margin-top: 0; font-size: 1.5rem; }
      p { line-height: 1.5; }
      #status { min-height: 1.5rem; font-weight: 600; }
      .controls { display: flex; gap: 0.75rem; margin: 1.5rem 0 1rem; }
      button {
        min-height: 2.75rem;
        padding: 0 1.1rem;
        border: 0;
        border-radius: 0.5rem;
        background: #155eef;
        color: white;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { cursor: not-allowed; opacity: 0.45; }
      #end { background: #b42318; }
      .note { color: #475467; font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Browser practice call</h1>
      <p id="status" role="status" aria-live="polite">Call ended</p>
      <div class="controls">
        <button id="start" type="button">Start call</button>
        <button id="end" type="button" disabled>End call</button>
      </div>
      <p class="note">Use headphones so the agent doesn't hear itself.</p>
    </main>
    <script>
      const startButton = document.querySelector("#start");
      const endButton = document.querySelector("#end");
      const statusLine = document.querySelector("#status");
      let socket;
      let microphone;
      let captureContext;
      let playbackContext;
      let worklet;
      let mutedOutput;
      let playCursor = 0;
      let scheduledSources = new Set();
      let callError = "";

      const workletSource = `
        class PcmCaptureProcessor extends AudioWorkletProcessor {
          constructor() {
            super();
            this.buffer = [];
            this.position = 0;
            this.step = sampleRate / 16000;
            this.chunk = [];
          }
          process(inputs) {
            const channels = inputs[0];
            if (!channels || channels.length === 0) return true;
            const length = channels[0].length;
            for (let index = 0; index < length; index++) {
              let value = 0;
              for (const channel of channels) value += channel[index] || 0;
              this.buffer.push(value / channels.length);
            }
            while (this.position + 1 < this.buffer.length) {
              const base = Math.floor(this.position);
              const fraction = this.position - base;
              this.chunk.push(this.buffer[base] * (1 - fraction) + this.buffer[base + 1] * fraction);
              this.position += this.step;
              if (this.chunk.length === 320) {
                const pcm = new Int16Array(320);
                for (let index = 0; index < 320; index++) {
                  const sample = Math.max(-1, Math.min(1, this.chunk[index]));
                  pcm[index] = sample < 0 ? sample * 32768 : sample * 32767;
                }
                this.port.postMessage(pcm.buffer, [pcm.buffer]);
                this.chunk = [];
              }
            }
            const consumed = Math.min(Math.floor(this.position), this.buffer.length - 1);
            if (consumed > 0) {
              this.buffer.splice(0, consumed);
              this.position -= consumed;
            }
            return true;
          }
        }
        registerProcessor("pcm-capture-processor", PcmCaptureProcessor);
      `;

      function setStatus(message) {
        statusLine.textContent = message;
      }

      function stopScheduledAudio() {
        for (const source of scheduledSources) {
          try { source.stop(); } catch {}
        }
        scheduledSources.clear();
        playCursor = playbackContext ? playbackContext.currentTime : 0;
      }

      function playPcm(arrayBuffer) {
        if (!playbackContext || arrayBuffer.byteLength < 2) return;
        const view = new DataView(arrayBuffer);
        const samples = new Float32Array(Math.floor(arrayBuffer.byteLength / 2));
        for (let index = 0; index < samples.length; index++) {
          samples[index] = view.getInt16(index * 2, true) / 32768;
        }
        const audio = playbackContext.createBuffer(1, samples.length, 24000);
        audio.copyToChannel(samples, 0);
        const source = playbackContext.createBufferSource();
        source.buffer = audio;
        source.connect(playbackContext.destination);
        scheduledSources.add(source);
        source.onended = () => scheduledSources.delete(source);
        const startAt = Math.max(playCursor, playbackContext.currentTime);
        source.start(startAt);
        playCursor = startAt + audio.duration;
      }

      async function releaseMedia() {
        if (microphone) {
          microphone.getTracks().forEach(track => track.stop());
          microphone = null;
        }
        if (worklet) {
          worklet.port.onmessage = null;
          worklet.disconnect();
          worklet = null;
        }
        if (mutedOutput) {
          mutedOutput.disconnect();
          mutedOutput = null;
        }
        if (captureContext && captureContext.state !== "closed") {
          await captureContext.close();
        }
        if (playbackContext && playbackContext.state !== "closed") {
          stopScheduledAudio();
          await playbackContext.close();
        }
        captureContext = null;
        playbackContext = null;
      }

      async function finishCall() {
        await releaseMedia();
        startButton.disabled = false;
        endButton.disabled = true;
        setStatus(callError || "Call ended");
      }

      async function startCall() {
        startButton.disabled = true;
        endButton.disabled = false;
        callError = "";
        setStatus("Connecting…");
        try {
          microphone = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          });
          captureContext = new AudioContext();
          playbackContext = new AudioContext({ sampleRate: 24000 });
          const workletUrl = URL.createObjectURL(
            new Blob([workletSource], { type: "text/javascript" })
          );
          try {
            await captureContext.audioWorklet.addModule(workletUrl);
          } finally {
            URL.revokeObjectURL(workletUrl);
          }
          await captureContext.resume();
          await playbackContext.resume();

          const socketUrl = new URL("ws", location.href);
          socketUrl.protocol = location.protocol === "https:" ? "wss:" : "ws:";
          const token = new URLSearchParams(location.search).get("token");
          if (token) socketUrl.searchParams.set("token", token);
          socket = new WebSocket(socketUrl);
          socket.binaryType = "arraybuffer";
          socket.onopen = () => {
            const input = captureContext.createMediaStreamSource(microphone);
            worklet = new AudioWorkletNode(captureContext, "pcm-capture-processor");
            mutedOutput = captureContext.createGain();
            mutedOutput.gain.value = 0;
            worklet.port.onmessage = event => {
              if (socket && socket.readyState === WebSocket.OPEN) socket.send(event.data);
            };
            input.connect(worklet);
            worklet.connect(mutedOutput);
            mutedOutput.connect(captureContext.destination);
            setStatus("Connected — start speaking");
          };
          socket.onmessage = event => {
            if (typeof event.data === "string") {
              try {
                if (JSON.parse(event.data).type === "clear") stopScheduledAudio();
              } catch {}
              return;
            }
            playPcm(event.data);
          };
          socket.onerror = () => {
            callError = "Call error: WebSocket connection failed.";
            socket.close();
          };
          socket.onclose = event => {
            if (!callError && event.code !== 1000) {
              callError = `Call error: connection closed (${event.code})${event.reason ? `: ${event.reason}` : ""}`;
            }
            finishCall();
          };
        } catch (error) {
          callError = `Call error: ${error instanceof Error ? error.message : String(error)}`;
          await finishCall();
          if (socket && socket.readyState < WebSocket.CLOSING) socket.close();
        }
      }

      function endCall() {
        if (socket && socket.readyState < WebSocket.CLOSING) {
          socket.close(1000, "Call ended");
        } else {
          finishCall();
        }
      }

      startButton.addEventListener("click", startCall);
      endButton.addEventListener("click", endCall);
    </script>
  </body>
</html>
