[project]
name = "inbound-voice"
version = "0.1.0"
description = "UK law firm inbound voice-agent M0 prototype"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[assemblyai,deepgram,elevenlabs,google,local-smart-turn,openrouter,runner,silero,soniox,speechify,webrtc]>=1.12.0,<2",
    "pydantic>=2.10,<3",
    "pyyaml>=6.0,<7",
    "email-validator>=2.2,<3",
    "trafilatura>=2.3.1",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools.packages.find]
include = ["inbound_voice*"]
